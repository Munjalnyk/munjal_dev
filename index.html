    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111110" id="meta-theme-color" />
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var light;
        if (saved) {
          light = saved === 'light';
        } else {
          var h = new Date().getHours();
          light = h >= 7 && h < 19;
        }
        if (light) {
          document.documentElement.classList.add('light');
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#f6f5f0');
        }
      })();
    </script>

    <style>
      :root {
        --pl-bg: #111110;
        --pl-ink: #eceae3;
        --pl-soft: #717068;
        --pl-line: #2c2c29;
        --pl-accent: #ff5722;
      }
      .light {
        --pl-bg: #f6f5f0;
        --pl-ink: #1c1c1a;
        --pl-soft: #8e8c83;
        --pl-line: #d5d2c8;
        --pl-accent: #d13c0a;
      }
      body { margin: 0; background: var(--pl-bg); overflow: hidden; }
      #html-preloader {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        background: var(--pl-bg);
        color: var(--pl-ink);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        transition: opacity 0.5s ease;
      }
      #html-preloader.fade-out { opacity: 0; }
      .pl-corner {
        position: absolute;
        font-size: 14px;
        color: var(--pl-soft);
        opacity: 0;
        animation: pl-fadein 0.4s 0.2s forwards;
      }
      .pl-tl { top: 1.25rem; left: 1.5rem; }
      .pl-tr { top: 1.25rem; right: 1.5rem; }
      .pl-bl { bottom: 1.25rem; left: 1.5rem; }
      .pl-br { bottom: 1.25rem; right: 1.5rem; }
      .pl-meta {
        position: absolute;
        font-size: 9px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--pl-soft);
        opacity: 0;
        animation: pl-fadein 0.5s 0.3s forwards;
      }
      .pl-meta-top { top: 1.4rem; left: 50%; transform: translateX(-50%); white-space: nowrap; }
      .pl-meta-bottom { bottom: 1.4rem; left: 50%; transform: translateX(-50%); white-space: nowrap; }
      .pl-wrap { display: flex; flex-direction: column; align-items: center; }
      .pl-counter {
        font-size: clamp(3rem, 9vw, 5.5rem);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        opacity: 0;
        animation: pl-fadein 0.4s 0.1s forwards;
      }
      .pl-counter small { font-size: 0.35em; color: var(--pl-accent); margin-left: 0.15em; }
      .pl-bar-wrap {
        margin-top: 2rem; width: 14rem; height: 2px;
        background: var(--pl-line);
        overflow: hidden;
        opacity: 0;
        animation: pl-fadein 0.4s 0.3s forwards;
      }
      .pl-bar {
        height: 100%; width: 0%;
        background: var(--pl-accent);
        transition: width 0.15s ease-out;
      }
      .pl-text {
        margin-top: 1.25rem;
        font-size: 9px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--pl-soft);
        opacity: 0;
        animation: pl-fadein 0.4s 0.4s forwards;
      }
      @keyframes pl-fadein { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="html-preloader">
      <span class="pl-corner pl-tl">+</span>
      <span class="pl-corner pl-tr">+</span>
      <span class="pl-corner pl-bl">+</span>
      <span class="pl-corner pl-br">+</span>
      <div class="pl-meta pl-meta-top">MN — Technical file</div>
      <div class="pl-wrap">
        <div class="pl-counter"><span id="pl-num">000</span><small>%</small></div>
        <div class="pl-bar-wrap"><div class="pl-bar" id="pl-bar"></div></div>
        <div class="pl-text">Loading assets</div>
      </div>
      <div class="pl-meta pl-meta-bottom">Sydney, AU — 33.87°S / 151.21°E</div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        var images = ['/img/perfil.png', '/img/hero.jpg', '/img/MRTS.jpeg'];
        var total = images.length + 1;
        var loaded = 0;
        var numEl = document.getElementById('pl-num');
        var barEl = document.getElementById('pl-bar');

        function update() {
          loaded++;
          var pct = Math.min(Math.round((loaded / total) * 100), 100);
          if (numEl) numEl.textContent = String(pct).padStart(3, '0');
          if (barEl) barEl.style.width = pct + '%';
        }

        images.forEach(function(src) {
          var img = new Image();
          img.onload = update;
          img.onerror = update;
          img.src = src;
        });

        window.__onAppReady = function() {
          update();
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
