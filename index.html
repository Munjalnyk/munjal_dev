    <style>
      body { margin: 0; background: #050505; overflow: hidden; }
      #html-preloader {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        background: #050505;
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #html-preloader.fade-out {
        opacity: 0;
        transform: translateY(-100%);
      }
      .pl-wrap { display: flex; flex-direction: column; align-items: center; }
      .pl-logo {
        font-family: 'Syne', sans-serif;
        font-size: clamp(3rem, 8vw, 5rem);
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #f0f0f0;
        margin-bottom: 2rem;
        opacity: 0;
        animation: pl-fadein 0.5s 0.1s forwards;
      }
      .pl-logo span {
        background: linear-gradient(135deg, #c8a96e 0%, #e8d5a8 50%, #c8a96e 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .pl-line {
        width: 0; height: 1px;
        background: linear-gradient(90deg, transparent, #c8a96e, transparent);
        animation: pl-expand 0.6s 0.3s forwards;
      }
      .pl-counter {
        margin-top: 2rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 300;
        color: #c8a96e;
        opacity: 0;
        animation: pl-fadein 0.4s 0.4s forwards;
      }
      .pl-counter small { font-size: 0.5em; color: rgba(200,169,110,0.4); }
      .pl-bar-wrap {
        margin-top: 1.5rem; width: 12rem; height: 1px;
        background: rgba(255,255,255,0.05);
        border-radius: 4px; overflow: hidden;
        opacity: 0;
        animation: pl-fadein 0.4s 0.4s forwards;
      }
      .pl-bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, rgba(200,169,110,0.6), #c8a96e);
        border-radius: 4px;
        transition: width 0.15s ease-out;
      }
      .pl-text {
        margin-top: 1.25rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(106,106,106,0.6);
        opacity: 0;
        animation: pl-fadein 0.4s 0.5s forwards;
      }
      .pl-corner {
        position: absolute; width: 2rem; height: 2rem;
        opacity: 0;
        animation: pl-fadein 0.3s 0.3s forwards;
      }
      .pl-tl { top: 1.5rem; left: 1.5rem; border-top: 1px solid rgba(200,169,110,0.2); border-left: 1px solid rgba(200,169,110,0.2); }
      .pl-tr { top: 1.5rem; right: 1.5rem; border-top: 1px solid rgba(200,169,110,0.2); border-right: 1px solid rgba(200,169,110,0.2); }
      .pl-bl { bottom: 1.5rem; left: 1.5rem; border-bottom: 1px solid rgba(200,169,110,0.2); border-left: 1px solid rgba(200,169,110,0.2); }
      .pl-br { bottom: 1.5rem; right: 1.5rem; border-bottom: 1px solid rgba(200,169,110,0.2); border-right: 1px solid rgba(200,169,110,0.2); }
      @keyframes pl-fadein { to { opacity: 1; } }
      @keyframes pl-expand { to { width: 120px; } }
    </style>
  </head>
  <body>
    <!-- Instant preloader - renders before ANY JavaScript loads -->
    <div id="html-preloader">
      <div class="pl-corner pl-tl"></div>
      <div class="pl-corner pl-tr"></div>
      <div class="pl-corner pl-bl"></div>
      <div class="pl-corner pl-br"></div>
      <div class="pl-wrap">
        <div class="pl-logo">M<span>N</span></div>
        <div class="pl-line"></div>
        <div class="pl-counter"><span id="pl-num">000</span><small>%</small></div>
        <div class="pl-bar-wrap"><div class="pl-bar" id="pl-bar"></div></div>
        <div class="pl-text">Loading assets</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Track real loading progress before React even loads
      (function() {
        var images = ['/img/perfil.png', '/img/hero.jpg', '/img/MRTS.jpeg'];
        var total = images.length + 1; // +1 for the main JS bundle
        var loaded = 0;
        var numEl = document.getElementById('pl-num');
        var barEl = document.getElementById('pl-bar');

        function update() {
          loaded++;
          var pct = Math.min(Math.round((loaded / total) * 100), 100);
          if (numEl) numEl.textContent = String(pct).padStart(3, '0');
          if (barEl) barEl.style.width = pct + '%';
        }

        images.forEach(function(src) {
          var img = new Image();
          img.onload = update;
          img.onerror = update;
          img.src = src;
        });

        // Mark JS loaded when this script module executes
        window.__onAppReady = function() {
          update();
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
