<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — Nayak</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#1a1c1e;
    --muted:#808488;
    --hair:#dfe1e4;
    --page:#3a3d40;
    --bar:#1a1c1e;
    --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:var(--sans);background:var(--page);color:#fff;}
  body{display:flex;flex-direction:column;}

  /* top toolbar */
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--bar);padding:12px 20px;flex:0 0 auto;
    box-shadow:0 1px 0 rgba(255,255,255,.06);
  }
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand .name{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.5px;}
  .brand .ref{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .actions{display:flex;gap:10px;flex:0 0 auto;}
  .btn{
    font-family:var(--sans);font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);
    padding:8px 14px;border-radius:7px;cursor:pointer;text-decoration:none;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{background:#fff;color:var(--ink);border-color:#fff;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;}

  /* viewer area */
  .viewer{flex:1 1 auto;position:relative;min-height:0;}
  .viewer object,.viewer embed,.viewer iframe{
    width:100%;height:100%;border:0;display:block;background:var(--page);
  }

  /* fallback shown only if embed fails */
  .fallback{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px;
  }
  .fallback.show{display:flex;}
  .fallback h2{font-family:var(--serif);font-weight:700;font-size:22px;}
  .fallback p{color:#c8cccf;font-size:14px;max-width:360px;line-height:1.6;}

  @media (max-width:560px){
    .toolbar{padding:10px 14px;gap:10px;}
    .brand .ref{display:none;}
    .btn{padding:8px 11px;font-size:12px;}
    .btn .lbl{display:none;}   /* icons only on small screens */
    .btn{gap:0;}
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="brand">
      <span class="name">NAYAK</span>
      <span class="ref" id="ref">Invoice</span>
    </div>
    <div class="actions">
      <button class="btn" id="printBtn" title="Print">
        <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span class="lbl">Print</span>
      </button>
      <a class="btn" id="downloadBtn" title="Download" download>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="lbl">Download</span>
      </a>
    </div>
  </div>

  <div class="viewer">
    <object id="pdfObject" type="application/pdf" data="">
      <iframe id="pdfFrame" src="" title="Invoice PDF"></iframe>
    </object>
    <div class="fallback" id="fallback">
      <h2>Preview unavailable</h2>
      <p>Your browser can't display the PDF inline. You can open or download it directly instead.</p>
      <a class="btn" id="fallbackOpen" target="_blank" rel="noopener">Open PDF</a>
    </div>
  </div>

<script>
  (function(){
    // Derive the invoice reference from the folder in the URL path.
    // e.g. /invoice/INV-2026-0603/  ->  INV-2026-0603
    var parts = window.location.pathname.split('/').filter(Boolean);
    var ref = parts[parts.length - 1] || '';
    // If the last segment looks like a file, step back one.
    if (ref.indexOf('.') !== -1 && parts.length > 1) ref = parts[parts.length - 2];

    var pdfUrl = ref ? ref + '.pdf' : '';   // PDF sits beside this page

    var refEl = document.getElementById('ref');
    if (ref) refEl.textContent = ref;
    document.title = ref ? ref + ' — Nayak' : 'Invoice — Nayak';

    var obj = document.getElementById('pdfObject');
    var frame = document.getElementById('pdfFrame');
    var dl = document.getElementById('downloadBtn');
    var fbOpen = document.getElementById('fallbackOpen');

    if (pdfUrl){
      obj.data = pdfUrl;
      frame.src = pdfUrl + '#view=FitH';
      dl.href = pdfUrl;
      dl.setAttribute('download', ref + '.pdf');
      fbOpen.href = pdfUrl;
    }

    // Print: focus the embedded PDF and print, with a fallback to opening it.
    document.getElementById('printBtn').addEventListener('click', function(){
      try {
        var win = frame.contentWindow;
        if (win){ win.focus(); win.print(); }
        else { window.open(pdfUrl, '_blank'); }
      } catch(e){
        window.open(pdfUrl, '_blank');
      }
    });

    // If the object can't render (no PDF plugin), reveal the fallback.
    obj.addEventListener('error', function(){
      document.getElementById('fallback').classList.add('show');
    });
  })();
</script>

</body>
</html>
