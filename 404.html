<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Munjal Nayak</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --color-bg-primary: #0a0a0f;
            --color-accent-primary: #00d4ff;
            --color-accent-secondary: #7c3aed;
            --color-text-primary: #ffffff;
            --color-text-secondary: #a1a1aa;
            --color-border: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Animated background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }
        
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1;
        }
        
        .bg-glow-1 {
            top: -200px;
            left: -200px;
            background: var(--color-accent-primary);
            animation: float 15s ease-in-out infinite;
        }
        
        .bg-glow-2 {
            bottom: -200px;
            right: -200px;
            background: var(--color-accent-secondary);
            animation: float 15s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }
        
        /* Content */
        .error-container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        .error-code {
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 700;
            line-height: 1;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: glitch 5s infinite;
        }
        
        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .error-code::before {
            animation: glitch-1 2s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }
        
        .error-code::after {
            animation: glitch-2 2s infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }
        
        @keyframes glitch {
            0%, 90%, 100% { opacity: 1; }
            92%, 94%, 96%, 98% { opacity: 0.8; }
        }
        
        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -3px); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(3px, 3px); }
        }
        
        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(3px, -3px); }
            40% { transform: translate(-3px, 3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(-3px, -3px); }
        }
        
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 600;
            margin: 1rem 0;
            color: var(--color-text-primary);
        }
        
        .error-message {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            max-width: 500px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }
        
        .error-message code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 212, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--color-accent-primary);
            font-size: 0.9rem;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: var(--gradient-primary);
            color: var(--color-bg-primary);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }
        
        .btn-home:hover::before {
            left: 100%;
        }
        
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }
        
        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--color-accent-primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: particle-float linear infinite;
        }
        
        @keyframes particle-float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }
        
        /* Circuit lines decoration */
        .circuit {
            position: fixed;
            width: 200px;
            height: 200px;
            opacity: 0.1;
        }
        
        .circuit-1 {
            top: 10%;
            left: 5%;
        }
        
        .circuit-2 {
            bottom: 10%;
            right: 5%;
            transform: rotate(180deg);
        }
        
        .circuit svg {
            width: 100%;
            height: 100%;
        }
        
        .circuit path {
            fill: none;
            stroke: var(--color-accent-primary);
            stroke-width: 2;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: circuit-draw 3s ease forwards infinite;
        }
        
        @keyframes circuit-draw {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        /* Links */
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .quick-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .quick-link:hover {
            color: var(--color-accent-primary);
        }
        
        .quick-link i {
            font-size: 0.8rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .circuit {
                display: none;
            }
            
            .quick-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <!-- Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Circuit Decorations -->
    <div class="circuit circuit-1">
        <svg viewBox="0 0 200 200">
            <path d="M10,100 L50,100 L50,50 L100,50 L100,100 L150,100 L150,150 L190,150" />
            <path d="M10,150 L40,150 L40,120 L80,120 L80,80 L120,80" />
        </svg>
    </div>
    <div class="circuit circuit-2">
        <svg viewBox="0 0 200 200">
            <path d="M10,100 L50,100 L50,50 L100,50 L100,100 L150,100 L150,150 L190,150" />
            <path d="M10,150 L40,150 L40,120 L80,120 L80,80 L120,80" />
        </svg>
    </div>
    
    <!-- Content -->
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Looks like you've ventured into uncharted territory. 
            The page you're looking for doesn't exist or has been moved.
            <br><br>
            <code>Error: ENOENT - No such file or directory</code>
        </p>
        
        <a href="/" class="btn-home">
            <i class="fas fa-home"></i>
            Back to Home
        </a>
        
        <div class="quick-links">
            <a href="/#about" class="quick-link">
                <i class="fas fa-chevron-right"></i>
                About Me
            </a>
            <a href="/#experience" class="quick-link">
                <i class="fas fa-chevron-right"></i>
                Experience
            </a>
            <a href="/#projects" class="quick-link">
                <i class="fas fa-chevron-right"></i>
                Projects
            </a>
            <a href="/#contact" class="quick-link">
                <i class="fas fa-chevron-right"></i>
                Contact
            </a>
        </div>
    </div>
    
    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.animationDelay = (Math.random() * 10) + 's';
            particle.style.width = (Math.random() * 4 + 2) + 'px';
            particle.style.height = particle.style.width;
            
            // Random color
            const colors = ['#00d4ff', '#7c3aed', '#f472b6'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            particlesContainer.appendChild(particle);
        }
        
        // Console message
        console.log('%c🔍 Looking for something?', 'font-size: 18px; color: #00d4ff;');
        console.log('%cThis page doesn\'t exist. Head back home!', 'font-size: 14px; color: #7c3aed;');
    </script>
</body>
</html>
